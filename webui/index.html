<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="description" content="OSMP — your self-hosted music player">
<title>OSMP</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/player.css">
</head>
<body>

<!-- drifting aurora mesh background -->
<div id="bg-mesh" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div id="boot-splash">
  <div class="splash-logo">
    <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="hsl(178 85% 50%)"/><stop offset="1" stop-color="hsl(265 85% 62%)"/>
      </linearGradient></defs>
      <rect x="4" y="4" width="40" height="40" rx="12" fill="none" stroke="url(#lg)" stroke-width="3"/>
      <rect x="13" y="22" width="4" height="12" rx="2" fill="url(#lg)" class="eq e1"/>
      <rect x="22" y="14" width="4" height="20" rx="2" fill="url(#lg)" class="eq e2"/>
      <rect x="31" y="19" width="4" height="15" rx="2" fill="url(#lg)" class="eq e3"/>
    </svg>
  </div>
  <div class="splash-text">OSMP</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
</div>

<div id="app" class="hidden">
  <!-- ══════════════ sidebar ══════════════ -->
  <aside id="sidebar">
    <a class="logo" href="#/home" aria-label="OSMP home">
      <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <defs><linearGradient id="lg2" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="hsl(var(--accent-h) 85% 52%)"/><stop offset="1" stop-color="hsl(calc(var(--accent-h) + 80) 85% 62%)"/>
        </linearGradient></defs>
        <rect x="4" y="4" width="40" height="40" rx="12" fill="none" stroke="url(#lg2)" stroke-width="3.4"/>
        <rect x="13" y="22" width="4" height="12" rx="2" fill="url(#lg2)"/>
        <rect x="22" y="14" width="4" height="20" rx="2" fill="url(#lg2)"/>
        <rect x="31" y="19" width="4" height="15" rx="2" fill="url(#lg2)"/>
      </svg>
      <span class="logo-text">OSMP</span>
    </a>

    <nav id="main-nav" aria-label="Main">
      <a href="#/home"    data-route="home"     class="nav-item"><span class="nav-ico" data-icon="home"></span><span>Home</span></a>
      <a href="#/search"  data-route="search"   class="nav-item"><span class="nav-ico" data-icon="search"></span><span>Search</span></a>
      <a href="#/radio"   data-route="radio"    class="nav-item"><span class="nav-ico" data-icon="radio"></span><span>Radio</span><span class="nav-badge beta">AI</span></a>
      <a href="#/library" data-route="library"  class="nav-item"><span class="nav-ico" data-icon="library"></span><span>Library</span></a>
    </nav>

    <div class="sidebar-section">
      <div class="section-head">
        <span>Playlists</span>
        <button id="btn-new-playlist" class="icon-btn sm" title="New playlist" data-icon-btn="plus"></button>
      </div>
      <div id="sidebar-playlists" class="scroll-y"></div>
    </div>

    <div class="sidebar-footer">
      <button id="btn-settings" class="nav-item" title="Settings"><span class="nav-ico" data-icon="settings"></span><span>Settings</span></button>
      <div id="offline-pill" class="offline-pill hidden" title="Server unreachable — showing cached UI"><span data-icon="cloud-off"></span> offline</div>
    </div>
  </aside>

  <!-- ══════════════ main view ══════════════ -->
  <main id="view-root" class="scroll-y" tabindex="-1"></main>

  <!-- ══════════════ queue drawer ══════════════ -->
  <section id="queue-drawer" aria-label="Play queue" aria-hidden="true">
    <header class="qd-head">
      <h2>Queue</h2>
      <div class="qd-actions">
        <button id="qd-clear" class="text-btn" title="Clear queue">Clear</button>
        <button id="qd-close" class="icon-btn" title="Close" data-icon-btn="close"></button>
      </div>
    </header>
    <div id="qd-now"></div>
    <div id="qd-list" class="scroll-y"></div>
  </section>
  <div id="queue-backdrop" class="hidden"></div>
</div>

<!-- ══════════════ player bar ══════════════ -->
<footer id="player-bar" class="hidden">
  <div id="pb-ambient" aria-hidden="true"></div>
  <div class="pb-track">
    <button id="pb-cover-btn" class="pb-cover-btn" title="Open now playing">
      <div id="pb-cover" class="pb-cover"><span data-icon="music"></span></div>
    </button>
    <div class="pb-meta">
      <div id="pb-title" class="pb-title">Nothing playing</div>
      <div id="pb-artist" class="pb-artist">pick a track to start</div>
    </div>
    <button id="pb-like" class="icon-btn like" title="Save to Liked" data-icon-btn="heart"></button>
  </div>

  <div class="pb-center">
    <div class="pb-controls">
      <button id="pb-shuffle" class="icon-btn" title="Shuffle" data-icon-btn="shuffle"></button>
      <button id="pb-prev" class="icon-btn" title="Previous" data-icon-btn="prev"></button>
      <button id="pb-play" class="play-btn" title="Play" data-icon-btn="play"></button>
      <button id="pb-next" class="icon-btn" title="Next" data-icon-btn="next"></button>
      <button id="pb-repeat" class="icon-btn" title="Repeat off" data-icon-btn="repeat"></button>
    </div>
    <div class="pb-timeline">
      <span id="pb-cur" class="pb-time">0:00</span>
      <div id="pb-progress" role="slider" aria-label="Seek" tabindex="0"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="pb-buffered" class="pb-buffered"></div>
        <div id="pb-played" class="pb-played"><div class="pb-knob"></div></div>
      </div>
      <span id="pb-dur" class="pb-time">0:00</span>
    </div>
  </div>

  <div class="pb-right">
    <button id="pb-sleep" class="icon-btn" title="Sleep timer" data-icon-btn="moon"></button>
    <span id="pb-sleep-count" class="sleep-count hidden"></span>
    <button id="pb-queue" class="icon-btn" title="Queue" data-icon-btn="queue"></button>
    <div class="pb-volume">
      <button id="pb-mute" class="icon-btn" title="Mute" data-icon-btn="volume"></button>
      <input id="pb-vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
    <button id="pb-expand" class="icon-btn mobile-only" title="Now playing" data-icon-btn="expand"></button>
  </div>
</footer>

<!-- ══════════════ now playing overlay ══════════════ -->
<div id="np-overlay" class="hidden" aria-hidden="true">
  <div id="np-ambient" aria-hidden="true"></div>
  <header class="np-head">
    <button id="np-close" class="icon-btn" title="Close" data-icon-btn="chevron-down"></button>
    <div class="np-head-label">Now Playing</div>
    <button id="np-queue" class="icon-btn" title="Queue" data-icon-btn="queue"></button>
  </header>
  <div class="np-body">
    <div class="np-cover-wrap"><div id="np-cover" class="np-cover"></div></div>
    <div class="np-info">
      <h1 id="np-title"></h1>
      <div id="np-artist"></div>
      <div class="np-actions">
        <button id="np-like" class="icon-btn" title="Save to Liked" data-icon-btn="heart"></button>
        <button id="np-download" class="icon-btn" title="Download for offline" data-icon-btn="download"></button>
        <button id="np-playlist" class="icon-btn" title="Add to playlist" data-icon-btn="playlist-plus"></button>
        <button id="np-radio" class="icon-btn" title="Start radio from this track" data-icon-btn="radio"></button>
        <button id="np-sleep" class="icon-btn" title="Sleep timer" data-icon-btn="moon"></button>
      </div>
    </div>
  </div>
</div>

<!-- hosts -->
<div id="toast-host" aria-live="polite"></div>
<div id="modal-host"></div>
<div id="ctx-menu" class="hidden"></div>

<!-- PIN gate -->
<div id="pin-overlay" class="hidden">
  <form id="pin-form" class="pin-card">
    <div class="pin-logo">🔒</div>
    <h2>OSMP is locked</h2>
    <p>Enter your access PIN</p>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" autofocus>
    <button type="submit" class="btn primary block">Unlock</button>
    <div id="pin-error" class="pin-error hidden">Wrong PIN — try again</div>
  </form>
</div>

<audio id="audio-el" preload="auto"></audio>
<script type="module" src="/js/app.js"></script>
</body>
</html>
