# ──────────────────────────────────────────────────────────────────────
# OSMP Windows CI workflow — READY TO ENABLE.
#
# Copy (or move) this file to  .github/workflows/windows.yml  in the repo
# root and CI will build + smoke-test the Windows client on every release
# tag and attach osmp-windows-x64.zip to the release.
#
# Why it isn't there yet: pushing files under .github/workflows/ requires
# a token with the "workflows" permission, which the release token used
# for OSMP's pushes doesn't have. Either
#   a) open https://github.com/ION-FX/OSMP/new/main, name the file
#      .github/workflows/windows.yml and paste this file's contents, or
#   b) give the token workflow scope and push it from a checkout.
# ──────────────────────────────────────────────────────────────────────
name: windows-build

# Builds the OSMP Windows desktop client on a real Windows runner and
# smoke-tests it (the exe boots its embedded server and loads the UI
# offscreen; the plain server gets a health check too). On version tags
# the zip is attached to the release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - ".github/workflows/windows.yml"
      - "scripts/build_windows.ps1"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "scripts/build_windows.ps1"
      - "desktop/**"
      - "server/**"
      - "webui/**"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyside6 -r server/requirements.txt

      - name: Fetch static ffmpeg.exe
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path vendor\ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item ffmpeg-tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe vendor\ffmpeg\ffmpeg.exe
          Remove-Item ffmpeg.zip, ffmpeg-tmp -Recurse -Force
          (Get-Item vendor\ffmpeg\ffmpeg.exe).Length

      - name: Build + smoke test the exe
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Plain server health check on Windows
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Start-Process python -ArgumentList "server\run.py","--port","8799","--data","$env:TEMP\osmp-srv-data" -PassThru -NoNewWindow -RedirectStandardOutput "$env:TEMP\osmp-srv.log" -RedirectStandardError "$env:TEMP\osmp-srv-err.log"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try { $h = Invoke-RestMethod http://127.0.0.1:8799/api/health; if ($h.ok) { $ok = $true; break } } catch {}
            }
            if (-not $ok) { Get-Content "$env:TEMP\osmp-srv.log","$env:TEMP\osmp-srv-err.log" -ErrorAction SilentlyContinue; throw "server did not become healthy" }
            Write-Host "server healthy on Windows"
          } finally { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmp-windows-x64
          path: dist/osmp-windows-x64.zip
          if-no-files-found: error

      - name: Attach zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes }
          gh release upload $tag dist/osmp-windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ github.token }}
