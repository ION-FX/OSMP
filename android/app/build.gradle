plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.osmp.app'
    compileSdk 34

    defaultConfig {
        applicationId "dev.osmp.app"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "0.7.7"
    }

    signingConfigs {
        release {
            // keystore is generated by scripts/build_android.sh (gitignored)
            def ks = rootProject.file("keystore/osmp-release.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword "osmp-release"
                keyAlias "osmp"
                keyPassword "osmp-release"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file("keystore/osmp-release.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources { excludes += ['META-INF/*.kotlin_module'] }
    }
}

dependencies {
    // intentionally empty — framework only
}
